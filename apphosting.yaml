# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 10
  memory: 1024Mi
  cpu: 1

env:
  - variable: WHMCS_API_URL
    value: https://your-whmcs-url.com/includes/api.php
  - variable: WHMCS_API_IDENTIFIER
    value: YOUR_IDENTIFIER
  - variable: WHMCS_API_SECRET
    value: YOUR_SECRET
